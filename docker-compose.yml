version: '3.8'

services:
  api:
    build: .
    container_name: otbr-manager-api
    ports:
      - "8000:8000"
    volumes:
      - ./firmware:/app/firmware
      - ./logs:/app/logs
      - ./otbr_manager.db:/app/otbr_manager.db
    environment:
      - DATABASE_URL=sqlite:///./otbr_manager.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: otbr-manager-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

